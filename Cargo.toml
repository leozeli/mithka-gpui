[workspace]
members = [".", "gtk", "gpui", "rss"]
resolver = "2"

[package]
name = "mithka-tdlib"
version = "0.1.0"
edition = "2021"
publish = false
description = "TDLib session core for a copied Mithka database, plus the headless CLI"
readme = "README.md"

[lib]
name = "mithka_tdlib"

[[bin]]
name = "mithka-tdlib-spike"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
libloading = "0.8"
serde_json = "1"
